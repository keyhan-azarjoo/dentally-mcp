services:
  dentally-mcp:
    build: .
    # No published version yet — build locally.
    image: dentally-mcp:local
    restart: unless-stopped
    # Bound to loopback on purpose. Put a TLS terminator (Caddy, nginx, Cloudflare)
    # in front of it before anything outside this host can reach it: the traffic
    # carries patient data and a bearer token.
    ports:
      - "127.0.0.1:8092:8092"
    env_file:
      - .env
    environment:
      DENTALLY_MCP_TRANSPORT: http
      DENTALLY_MCP_HOST: 0.0.0.0
      DENTALLY_MCP_PORT: "8092"
    volumes:
      # Token store and audit log survive a rebuild. Back this up — losing
      # tokens.enc means every practice has to re-authorise.
      - dentally-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  dentally-data:
