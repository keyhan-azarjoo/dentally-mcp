# nginx vhost for the Dentally MCP server.
#
# Use deploy/setup-nginx.sh rather than installing this by hand — it substitutes the
# hostname, checks for a conflicting $connection_upgrade map, and runs certbot in the
# right order.
#
# NOTE ON CERTBOT ORDER. This file deliberately ships as a PORT 80 BLOCK ONLY, with
# the full proxy configuration already in it. `certbot --nginx` clones this block to
# create the TLS one, so whatever is in `location /` here is what ends up serving
# HTTPS. An earlier version of this file also shipped a 443 block with a simpler
# location, and certbot's clone won — producing a TLS vhost with buffering ON, which
# makes every MCP client hang forever with no error. Keep the real configuration
# here, in the port-80 block, and let certbot derive the rest.
#
# The container binds 127.0.0.1 only, so nginx is the sole public entry point.

map $http_upgrade $connection_upgrade_dentally {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # Patient data crosses this hop. Nothing this API accepts is large, and a
    # generous body limit is just an amplification surface.
    client_max_body_size 1m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP's Streamable HTTP transport keeps a response open and pushes events
        # down it. With buffering on, nginx withholds them until the stream ends —
        # which for a streaming transport never happens. The client just hangs, and
        # it does not report an error, so this looks like "the server is broken".
        proxy_buffering off;
        proxy_cache off;

        # nginx's 60-second default would cut off a tool call that is waiting on a
        # slow Dentally response.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_dentally;
    }
}
