# nginx vhost for the Dentally MCP server.
#
# Install:
#   sudo cp deploy/nginx-dentally-mcp.conf /etc/nginx/sites-available/dentally-mcp
#   sudo sed -i "s/__HOST__/your.host.example.com/g" /etc/nginx/sites-available/dentally-mcp
#   sudo ln -s /etc/nginx/sites-available/dentally-mcp /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your.host.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The container binds 127.0.0.1 only. nginx is the sole public entry point, so TLS
# terminates here and the app never listens on a public interface itself.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # certbot rewrites this to a 301 once a certificate is issued. Until then, plain
    # HTTP has to answer so the ACME challenge can complete.
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __HOST__;

    # certbot fills these in with --nginx.
    # ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;

    # Patient data crosses this hop. Keep the body limit small: nothing this API
    # accepts is large, and a generous limit is just an amplification surface.
    client_max_body_size 1m;

    # Do not advertise the nginx version to the internet.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP's Streamable HTTP transport keeps a long-lived response open and pushes
        # events down it. With buffering on, nginx holds those events until the stream
        # ends — which for a streaming transport is "never", so the client just hangs.
        proxy_buffering off;
        proxy_cache off;

        # Long-poll friendly. A tool call that waits on a slow Dentally response must
        # not be cut off at nginx's 60-second default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Upgrade support, harmless when unused.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Needed by the Connection header above. If another vhost already defines this map,
# drop these three lines — nginx refuses to start on a duplicate.
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
