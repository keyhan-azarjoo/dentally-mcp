[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dentally-mcp"
version = "0.1.0"
description = "MCP server for Dentally — dental practice management, safely exposed to AI assistants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keyhan Azarjoo", email = "keyhanazarjoo@gmail.com" }]
keywords = ["mcp", "dentally", "dental", "practice-management", "ai", "claude", "openai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "mcp>=1.28,<2",
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "cryptography>=42",
]

[project.optional-dependencies]
sentry = ["sentry-sdk[starlette]>=2.0,<3"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]

[project.scripts]
dentally-mcp = "dentally_mcp.server:main"

[project.urls]
Homepage = "https://github.com/keyhan-azarjoo/dentally-mcp"
Issues = "https://github.com/keyhan-azarjoo/dentally-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
